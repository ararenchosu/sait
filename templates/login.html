<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}
body{background:#0f1929;color:white;height:100vh;display:flex;align-items:center;justify-content:center;}
.box{background:#142838;border:1px solid #244058;border-radius:12px;padding:2.5rem;width:90%;max-width:360px;}
h2{text-align:center;margin-bottom:1.5rem;}
input{width:100%;padding:0.9rem;margin-bottom:1rem;background:#1a2f42;border:1px solid #244058;border-radius:8px;color:white;font-size:1rem;}
button{width:100%;padding:0.9rem;background:#2584ff;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:1rem;}
button:hover{background:#1a75f0;}
.error{color:#ff6b6b;margin-bottom:1rem;text-align:center;}
</style>
</head>
<body>
<div class="box">
  <h2>🔐 開発環境ログイン</h2>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="password" name="password" placeholder="パスワードを入力">
    <button type="submit">ログイン</button>
  </form>
</div>
</body>
</html>
